<div
  ngCombobox
  #cb="ngCombobox"
  class="combobox-wrap"
  filterMode="manual"
  [disabled]="disabled()"
>
  <div
    #origin
    class="combobox-anchor"
  >
    <input
      ngComboboxInput
      type="text"
      class="combobox-trigger"
      [value]="query()"
      (valueChange)="query.set($event)"
      [placeholder]="placeholder()"
      [attr.aria-label]="placeholder()"
      [disabled]="disabled()"
      autocomplete="off"
    />
    <app-icon
      name="chevron-down"
      [size]="15"
      class="combobox-chevron"
      [class.combobox-chevron--open]="cb.expanded()"
      aria-hidden="true"
    />
  </div>

  <ng-template ngComboboxPopupContainer>
    <ng-template
      [cdkConnectedOverlay]="{ origin, usePopover: 'inline', matchWidth: true }"
      [cdkConnectedOverlayOpen]="true"
    >
      <div class="combobox-dropdown">
        <div
          ngListbox
          class="combobox-list"
          [values]="selectedValues()"
          (valuesChange)="onValuesChange($event); cb.close()"
        >
          @for (opt of filtered(); track opt.value) {
          <div
            ngOption
            [value]="opt.value"
            [label]="opt.label"
            class="combobox-option"
          >
            <div class="combobox-option-body">
              <span class="combobox-option-label">{{ opt.label }}</span>
              @if (opt.subtitle) {
              <span class="combobox-option-subtitle">{{ opt.subtitle }}</span>
              }
            </div>
            @if (opt.value === value()) {
            <app-icon
              name="check"
              [size]="14"
              class="combobox-check"
            />
            }
          </div>
          }
          @if (filtered().length === 0) {
          <p class="combobox-empty">No results</p>
          }
        </div>
      </div>
    </ng-template>
  </ng-template>
</div>
